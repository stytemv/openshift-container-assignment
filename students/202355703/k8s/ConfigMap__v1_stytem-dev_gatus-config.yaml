apiVersion: v1
data:
  config.yaml: |
    storage:
      type: memory

    endpoints:
      - name: Test Web Service
        group: OpenShift Services
        url: "http://test-web:8080/"
        interval: 30s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
kind: ConfigMap
metadata:
  name: gatus-config
