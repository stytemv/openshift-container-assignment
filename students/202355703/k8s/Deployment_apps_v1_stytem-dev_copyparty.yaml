apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copyparty
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: copyparty
    spec:
      containers:
        - name: copyparty
          image: ghcr.io/9001/copyparty-ac:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3923
              protocol: TCP
          env:
            - name: COPYPARTY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copyparty-auth
                  key: password
          args:
            - "-a"
            - "user:$(COPYPARTY_PASSWORD)"
            - "-v"
            - "/w::r,user:w,user"
            - "--xff-hdr"
            - "x-forwarded-for"
            - "--xff-src"
            - "lan"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3923
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3923
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: file-storage
              mountPath: /w
      volumes:
        - name: file-storage
          persistentVolumeClaim:
            claimName: file-data
